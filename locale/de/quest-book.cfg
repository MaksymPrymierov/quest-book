[quest-book-story]
wake=Der Alarm ist verstummt. Das Kolonieschiff Aurora liegt nun als Trümmer verstreut auf fremdem Gras. Eine Stimme knistert in Deinem Helm:\n„Du bist bei Bewusstsein? Ich bin ECHO, die Schiffsintelligenz. Oder das, was von mir übrig ist und in Deinem Anzug weiterlebt. Wir brauchen Metall. Fangen wir klein an.“
drills=„Du kannst nicht ewig von Hand graben. Befeuerte Erzförderer sind primitiv, aber sie funktionieren selbstständig. Platziere ein paar davon, und die Schmelzöfen bekommen Erz, während Du Dich um andere Dinge kümmerst.“
power=„Meine Batterien sind fast leer, und ohne Strom kann ich Dir nicht helfen. Ein Pumpwerk, ein Heizkessel und eine Dampfmaschine. Das einfachste Kraftwerk, das man sich vorstellen kann, aber für den Anfang reicht es.“
lab=„Ich höre den Generator summen. Gut. Meine Datenbanken sind beschädigt, aber ein Forschungslabor kann helfen, sie wiederherzustellen. Beginnen wir mit der Automatisierung. Wir können nicht alles von Hand erledigen.“
red-science=„Jedes rote Wissenschaftspaket stellt einen Teil meiner Erinnerung wieder her. Das habe ich wieder in Erinnerung: Die Aurora ist nicht zufällig vom Kurs abgekommen. Wir folgten einem Signal. Ich weiß noch nicht, woher es kam.“
red-rate=„Hundert Wissenschaftspakete in einer Kiste sind ein Vorrat, und Vorräte gehen zur Neige. Ich brauche einen Strom: 60 rote Wissenschaftspakete pro Minute, ohne Pausen. Das Produktionsfenster (P) zeigt Dir, ob Du das Tempo hältst.“
belts=„Du kannst Erz in Deinen Taschen transportieren. Oder es kann von selbst zu den Schmelzöfen fließen. Fließbänder werden zum Blutkreislauf Deiner Basis.“
green-science=„Ein zweites Wissenschaftspaket bedeutet eine neue Wissensstufe: Logistik, Sortierung, die ersten richtigen Produktionslinien. Ich erinnere mich an immer mehr. Das Signal war eine sich wiederholende Sequenz, die wie Koordinaten aussah.“
green-rate=„Jetzt dasselbe mit zwei Wissenschaftspaketen gleichzeitig. Wenn die grüne Linie der roten das Eisen wegnimmt, bleiben beide stehen. Rechne aus, wie viel Erz jede von ihnen braucht.“
turrets=„Alarm! Die örtliche Fauna reagiert auf die Verschmutzung durch Deine Schmelzöfen. Beißergruppen sind bereits ganz in der Nähe. Wir brauchen Geschütztürme, und die Geschütztürme brauchen Munition. Sehr viel Munition.“
walls=„Geschütztürme schießen gut, halten aber selbst nicht viel aus. Eine Mauer verschafft uns Zeit, und neue Militärtechnologie wird uns einen Vorteil verschaffen.“
nests=„Geschütztürme wehren Angriffe nur ab, während die Nester ständig neue Beißer hervorbringen. Solange sie in der Nähe der Fabrik stehen, hören die Angriffe nicht auf. Zeit für die Offensive: Zerstöre die Nester und die Würmer, die sie bewachen.“
firepower=„Die Nester wachsen, und die Beißer darin werden zäher. Neue Geschütztürme sind nicht immer die Antwort: Bessere Munition und eine höhere Feuerrate machen die bereits stehenden stärker.“
oil=„Unter uns liegt Öl. Ohne Öl gibt es keinen Kunststoff, keine Sprengstoffe und keinen Raketenbrennstoff. Förderpumpen, eine Raffinerie und jede Menge Rohre.“
plastic=„Kunststoff plus Kupfer plus eine Prise Hartnäckigkeit ergibt integrierte Schaltkreise. Jetzt können wir Maschinen bauen, nicht nur Mechanismen. Ich spüre, wie neue Module in meinem Inneren erwachen.“
circuit-rate=„Alles, was wir von nun an bauen, braucht Schaltkreise. Wenn sie knapp werden, steht die ganze Fabrik still. Sorge dafür, dass sie ununterbrochen fließen, statt sich in Kisten zu stapeln.“
military-science=„Die Beißer lernen dazu, also müssen wir das auch. Militärwissenschaft schaltet schwerere Waffen frei. Wir wollen keinen Krieg. Wir wollen genug Frieden, um arbeiten zu können.“
blue-science=„Chemische Wissenschaftspakete sind so wertvoll wie ein seltenes Mineral. Sie schalten Roboter, Solarenergie und Module frei. Und endlich habe ich einen Teil des Signals entschlüsselt: Es kommt von jenseits dieses Planeten.“
rails=„Die Erzvorkommen in der Nähe der Basis gehen zur Neige. Züge bringen Erz aus beliebiger Entfernung heran, und Deine Beine bekommen etwas Ruhe.“
solar=„Die Heizkessel müssen mit Brennstoff versorgt werden. Die Sonne scheint kostenlos, und Akkumulatoren versorgen uns auch nachts mit Strom.“
robots=„Erinnerst Du Dich daran, jedes Fließband von Hand platziert zu haben? Jetzt übernehmen das Roboter. Ein Bauschwarm errichtet eine Blaupause schneller, als Du einen Kaffee trinken könntest. Wobei wir zugegebenermaßen keinen haben.“
purple-science=„Produktionswissenschaft erfordert richtige Fabriken. Eine Handvoll Montagemaschinen reicht nicht mehr aus. Dafür brauchen wir Industrie.“
yellow-science=„Zubehörwissenschaft benötigt Motoren, Roboter und präzise Schaltkreise. Auf diesem Niveau können wir Dinge bauen, die fliegen.“
science-rate=„Die drei schwierigsten Wissenschaftspakete, jedes einmal pro Sekunde. Sobald diese Linie gleichmäßig läuft, müssen die Labore nicht mehr warten, und ich auch nicht.“
modules=„Jedes Modul macht eine Maschine ein wenig intelligenter. Effektverteiler übertragen diesen Effekt auf ihre Nachbarn. Effizienz wird unsere Waffe gegen die Zeit sein.“
rare-modules=„Eine Maschine mit einem Qualitätsmodul stellt manchmal etwas her, das besser ist als die Vorlage. Die Chance ist gering, also recycle den Ausschuss und versuche es erneut. Seltene Module sind es wert: Sie sind stärker als normale.“
nuclear=„Die Urananreicherung dauert lange, lohnt sich aber. Ein Kernreaktor liefert so viel Energie wie ein ganzes Feld voller Heizkessel. Vergiss nur die Kühlung nicht.“
silo=„Da sind wir also. Das Raketensilo ist unsere Eintrittskarte weg von diesem Planeten. Es benötigt Hunderte Bauteile und Tausende Komponenten. Fangen wir mit dem Bau an.“
launch=„Alles ist bereit. Mit einem Raketenstart antworten wir endlich auf das Signal. Irgendjemand da draußen sollte erfahren, was mit der Aurora geschehen ist und dass wir noch hier sind.“
space-science=„Der Satellit im Orbit sendet Daten. Weltraumforschung schaltet Wissen frei, das wir an der Oberfläche niemals erlangen könnten. Wenn unsere Reise hier endet, ist es ein würdiges Ende.“
mining-productivity=„Das Erz auf Nauvis ist nicht unendlich. Jede Stufe der Bergbau-Produktivität holt mehr aus demselben Vorkommen heraus, sodass die Erzförderer seltener umziehen müssen. Diese Technologie hat keine Grenze, und Stufe fünf ist ein guter Anfang.“
legendary=„Legendäre Qualität ist die Grenze dessen, was wir können. Jedes solche Modul durchläuft Hunderte von Versuchen und Recyclings. Dafür leistet eine Fabrik aus den besten Teilen mehr mit weniger.“
platform=„Raketen können mehr als nur Signale transportieren. Sie können Baumaterialien befördern. Bauen wir eine Plattform im Orbit, unsere eigene Insel im Himmel. Asteroidensammler und Zerkleinerer werden sie mit Nachschub versorgen.“
thrusters=„Im Moment schwebt die Plattform einfach an Ort und Stelle. Triebwerke werden ihr Bewegung ermöglichen. Und das Signal ist jetzt deutlicher: In diesem System gibt es weitere Planeten, und auf ihnen befinden sich die Peilsender der Rettungskapseln der Aurora.“
vulcanus-landing=„Vulcanus. Lava, Asche und Säure. Eine unserer Kapseln ist hier abgestürzt und sendet immer noch. Die Gießerei verarbeitet geschmolzenes Metall, und auf diesem Planeten kommst Du nicht ohne sie aus.“
vulcanus-science=„Große Erzförderer beißen sich sogar durch Wolfram. Metallurgische Wissenschaft erschließt die Geheimnisse der Hitze, und der Peilsender der Kapsel liefert uns das erste Koordinatenfragment.“
demolisher=„Die Zertrümmerer betrachten dieses Land als ihr Eigentum und zermalmen alles, was ihnen im Weg steht. Genau dort liegen die besten Vorkommen. Der kleine Zertrümmerer ist der schwächste von ihnen, also fang mit ihm an. Bereite Dich gut vor: Er regeneriert sich sehr schnell.“
fulgora-landing=„Fulgora. Ständige Stürme, und in den Ruinen liegt der Schrott einer vergangenen Zivilisation. Wiederverwerter zerlegen ihn in nützliche Teile, und Blitzableiter fangen die Energie des Himmels ein.“
fulgora-science=„Die elektromagnetische Fabrik vollbringt mit Holmium wahre Wunder. Dieser Planet sah einst aus wie unsere Basis, bis etwas ihn zerstörte. Wir haben das zweite Koordinatenfragment.“
gleba-landing=„Gleba. Hier lebt, wächst und verdirbt alles. Landwirtschaftstürme bringen die Ernte ein, und Biokammern verarbeiten sie. Achte auf die Frische. Nichts hier hält ewig.“
gleba-science=„Bioflux, leuchtende Früchte, Landwirtschaftswissenschaft. Gleba lehrt uns, dass auch die Produktion lebendig sein kann. Das dritte Koordinatenfragment weist auf einen eisigen Planeten.“
aquilo-landing=„Aquilo. Eis, ein Ammoniak-Ozean und eine Kälte, die Rohre bersten lässt. Ohne Heiztürme wirst Du hier nicht überleben. Von hier aus ist das Signal am deutlichsten.“
aquilo-science=„Kryotechnische Wissenschaft erschließt die letzten Geheimnisse der Physik. Jetzt kann ich alle Fragmente zusammensetzen: Das Signal kommt von jenseits des Randes des Sonnensystems.“
fusion=„Ein Fusionsreaktor ist eine kleine Sonne in einer Kiste. Mit dieser Energie können unsere Plattformen überallhin fliegen. Selbst an Orte, von denen noch niemand zurückgekehrt ist.“
planet-rate=„Vier Planeten, vier Wissenschaften, und jede muss jede Minute ankommen. Eine einzige stehende Linie, Millionen Kilometer entfernt, hält alles auf. Überprüfe jede einzelne.“
railgun=„Die Asteroiden am Rand des Systems sind zu viel für gewöhnliche Geschütztürme. Eine Schienenkanone spaltet selbst die größten. Wir sind bereit.“
edge=„Da ist sie, die Quelle des Signals. Ein Peilsender, älter als die Aurora, älter als jedes menschliche Raumschiff. Er rief nicht nach uns. Er rief nach jedem, der es so weit schaffen konnte. Und Du hast es geschafft.“
shattered=„Jenseits des Randes liegt der Zerbrochene Planet: die Überreste einer Welt, auf der einst vielleicht auch jemand Fabriken gebaut hat. Promethiumwissenschaft ist der Schlüssel zu dem Wissen, das der Peilsender seit Jahrhunderten bewahrt. Der letzte Eintrag in meinem Tagebuch gehört Dir, Ingenieur.“
