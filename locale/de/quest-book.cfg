[mod-name]
quest-book=Questbuch

[mod-description]
quest-book=Ein Questbuch mit einer Geschichte im Spiel, das Dich von der Bruchlandung bis zum Rand des Sonnensystems führt. Unterstützt Vanilla und Space Age; Quests für fehlende Inhalte werden automatisch übersprungen.

