[quest-book-story]
wake=Der Alarm ist verstummt. Das Kolonieschiff Aurora ist nur noch ein Trümmerfeld, verstreut über fremdes Gras. Eine Stimme knistert in deinem Helm:\n"Du bist bei Bewusstsein? Ich bin ECHO, die Schiffsintelligenz. Oder das, was von mir übrig ist und jetzt in deinem Anzug lebt. Wir brauchen Metall. Fangen wir klein an."
drills="Du kannst nicht ewig von Hand graben. Befeuerte Erzförderer sind primitiv, aber sie arbeiten von allein. Stell ein paar auf, dann liefern die Öfen Erz, während du dich um etwas anderes kümmerst."
power="Meine Batterien sind fast leer, und ohne Strom kann ich dir nicht helfen. Eine Pumpe, ein Heizkessel und eine Dampfmaschine. Das einfachste Kraftwerk, das man sich vorstellen kann – aber für den Anfang reicht es."
lab="Ich höre den Generator summen. Gut. Meine Datenbanken sind beschädigt, aber ein Forschungslabor kann helfen, sie wiederherzustellen. Fangen wir mit Automatisierung an. Wir können nicht alles von Hand erledigen."
red-science="Jede rote Wissenschaftspackung stellt einen Teil meiner Erinnerung wieder her. Das hier habe ich inzwischen rekonstruiert: Die Aurora kam nicht zufällig vom Kurs ab. Wir folgten einem Signal. Ich weiß noch nicht, woher es kam."
belts="Erz kann man in den Taschen tragen. Oder man lässt es ganz von selbst zu den Öfen fließen. Fließbänder werden zum Blutkreislauf deiner Basis."
green-science="Eine zweite Wissenschaftspackung bedeutet eine neue Ebene des Wissens: Logistik, Sortierung, die ersten echten Produktionslinien. Immer mehr Erinnerung kehrt zurück. Das Signal war eine sich wiederholende Folge, die wie Koordinaten aussah."
turrets="Alarm! Die einheimische Fauna reagiert auf die Verschmutzung deiner Öfen. Beißergruppen sind bereits in der Nähe. Wir brauchen Geschütztürme – und die brauchen Munition. Eine Menge Munition."
walls="Geschütztürme schießen gut, halten aber nicht viel aus. Eine Mauer verschafft uns Zeit, und neue Militärtechnologie gibt uns einen Vorteil."
oil="Unter uns liegt Öl. Ohne Öl gibt es keinen Kunststoff, keinen Sprengstoff und keinen Raketentreibstoff. Pumpen, eine Raffinerie und jede Menge Rohre."
plastic="Kunststoff plus Kupfer plus ein wenig Sturheit ergibt fortgeschrittene Schaltkreise. Jetzt können wir Maschinen bauen, nicht bloß Mechanismen. Ich spüre, wie weitere Module in mir erwachen."
military-science="Die Beißer lernen, also müssen wir das auch. Militärwissenschaft schaltet schwerere Waffen frei. Wir wollen keinen Krieg. Wir wollen nur genug Ruhe, um arbeiten zu können."
blue-science="Chemische Wissenschaftspackungen sind so wertvoll wie ein seltenes Mineral. Sie schalten Roboter, Solarenergie und Module frei. Und ich habe endlich einen Teil des Signals entschlüsselt: Es kommt von außerhalb dieses Planeten."
rails="Die Vorkommen nahe der Basis gehen zur Neige. Züge bringen Erz aus jeder Entfernung heran – und deine Beine bekommen etwas Ruhe."
solar="Die Heizkessel müssen ständig gefüttert werden. Die Sonne scheint kostenlos, und Akkumulatoren bringen uns durch die Nacht."
robots="Erinnerst du dich daran, jedes Fließband von Hand zu setzen? Jetzt übernehmen Roboter das. Ein Bauschwarm errichtet einen Bauplan schneller, als du einen Kaffee trinken könntest. Zugegeben, Kaffee haben wir nicht."
purple-science="Produktionswissenschaft verlangt nach echten Fabriken. Mit einer Handvoll Montagemaschinen ist es nicht mehr getan. Jetzt braucht es Industrie."
yellow-science="Nutzwissenschaft braucht Motoren, Roboter und präzise Schaltkreise. Auf diesem Niveau können wir Dinge bauen, die fliegen."
modules="Jedes Modul macht eine Maschine ein wenig klüger. Effektverteiler teilen diesen Vorteil mit ihren Nachbarn. Effizienz wird unsere Waffe gegen die Zeit."
nuclear="Urananreicherung ist langsam, aber sie lohnt sich. Ein Reaktor liefert so viel Energie wie ein ganzes Feld von Heizkesseln. Vergiss nur die Kühlung nicht."
silo="Da wären wir. Das Raketensilo ist unsere Fahrkarte von diesem Planeten. Es braucht Hunderte Teile und Tausende Komponenten. Also los, bauen wir."
launch="Alles ist bereit. Ein Start bedeutet, dass wir endlich auf das Signal antworten. Irgendjemand da draußen sollte erfahren, was mit der Aurora passiert ist – und dass wir noch hier sind."
space-science="Der Satellit im Orbit sendet Daten. Weltraumwissenschaft erschließt Wissen, das wir auf der Oberfläche niemals gewinnen könnten. Wenn unsere Reise hier endet, wäre es ein würdiges Ende."
platform="Raketen können mehr als Signale transportieren. Sie können Baumaterial befördern. Bauen wir eine Plattform im Orbit, unsere eigene Insel im Himmel. Asteroidensammler und Brecher werden sie mit Material versorgen."
thrusters="Im Moment hängt die Plattform nur an Ort und Stelle. Triebwerke werden sie in Bewegung setzen. Und das Signal wird klarer: Es gibt weitere Planeten in diesem System – und auf ihnen die Peilsender der Rettungskapseln der Aurora."
vulcanus-landing="Vulcanus. Lava, Asche und Säure. Eine unserer Kapseln ist hier abgestürzt und sendet noch immer. Die Gießerei arbeitet mit geschmolzenem Metall, und auf diesem Planeten kommst du ohne sie nicht weit."
vulcanus-science="Große Erzförderer beißen sich sogar durch Wolfram. Metallurgische Wissenschaft erschließt die Geheimnisse der Hitze, und der Peilsender der Kapsel liefert uns das erste Fragment der Koordinaten."
fulgora-landing="Fulgora. Unaufhörliche Stürme, und in den Ruinen liegt der Schrott einer vergangenen Zivilisation. Recycler zerlegen ihn in brauchbare Bestandteile, und Blitzableiter fangen die Energie des Himmels ein."
fulgora-science="Das elektromagnetische Werk vollbringt mit Holmium wahre Wunder. Dieser Planet sah einst aus wie unsere Basis, bis irgendetwas ihn zerstörte. Das zweite Koordinatenfragment gehört uns."
gleba-landing="Gleba. Alles hier lebt, wächst und verdirbt. Agrartürme bringen die Ernte ein, und Biokammern verarbeiten sie. Achte auf die Frische. Nichts hier hält ewig."
gleba-science="Bioflux, leuchtende Früchte, Agrarwissenschaft. Gleba lehrt uns, dass auch Produktion lebendig sein kann. Das dritte Koordinatenfragment weist auf einen eisigen Planeten."
aquilo-landing="Aquilo. Eis, ein Ammoniakozean und Kälte, die Rohre bersten lässt. Ohne Heiztürme überlebst du hier nicht. Von hier aus ist das Signal am klarsten."
aquilo-science="Kryotechnische Wissenschaft erschließt die letzten Geheimnisse der Physik. Jetzt kann ich alle Fragmente zusammensetzen: Das Signal kommt von jenseits des Randes des Sonnensystems."
fusion="Ein Fusionsreaktor ist eine kleine Sonne in einer Kiste. Mit so viel Energie können unsere Plattformen überallhin fliegen. Sogar dorthin, von wo noch niemand zurückgekehrt ist."
railgun="Die Asteroiden am Rand des Systems sind zu viel für gewöhnliche Geschütztürme. Eine Railgun spaltet selbst die größten. Wir sind bereit."
edge="Da ist es, die Quelle des Signals. Ein Peilsender, älter als die Aurora, älter als jedes menschliche Schiff. Er hat nicht uns gerufen. Er hat jeden gerufen, der es so weit schaffen konnte. Und du hast es geschafft."
shattered="Jenseits des Randes liegt der Zerschmetterte Planet: die Überreste einer Welt, auf der vielleicht einst ebenfalls jemand Fabriken gebaut hat. Promethium-Wissenschaft ist der Schlüssel zu dem Wissen, das der Peilsender seit Jahrhunderten bewahrt. Der letzte Eintrag in meinem Tagebuch gehört dir, Ingenieur."
