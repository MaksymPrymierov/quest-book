[mod-setting-description]
qb-tracker-limit=Wie viele aktive Quests die Zielübersicht gleichzeitig anzeigt.
qb-chat-messages=Gibt eine Chat-Nachricht aus, wenn eine Quest freigeschaltet oder abgeschlossen wird. Der Ton wird weiterhin abgespielt.
qb-rewards=Gibt für einige Quests Gegenstände. Deaktivieren, um ohne Hilfe zu spielen: Belohnungen werden ausgeblendet und können nicht eingefordert werden.

