[quest-book-story]
wake=Аварійна сирена стихла. Від колоніального корабля «Аврора» лишилися уламки, розкидані по чужій траві. У шоломі тріщить голос:\n«Ви при тямі? Я ЕХО, бортовий інтелект. Точніше, те, що від мене лишилося у вашому скафандрі. Нам потрібен метал. Почнімо з малого.»
drills=«Копати руками до ночі не вийде. Бурові на вугіллі не надто гарні, зате працюють самі. Поставте кілька, і печі отримають руду, поки ви займаєтесь іншим.»
power=«Мої батареї майже сіли, а без струму я не допоможу. Насос, котел і парова машина. Найпростіша електростанція, яку тільки можна придумати, але для початку вистачить.»
lab=«Чую, як гуде генератор. Чудово. Мої бази даних пошкоджені, але дослідна лабораторія допоможе їх відновити. Почнімо з автоматизації, ми не можемо все робити вручну.»
red-science=«Кожна червона колба відновлює шматок моєї пам'яті. Ось що я вже згадала: “Аврора” збилася з курсу не випадково. Нас вів сигнал. Звідки він ішов, поки не знаю.»
belts=«Руду можна носити в кишенях. А можна, щоб вона пливла до печей сама. Конвеєри стануть кровоносною системою вашої бази.»
green-science=«Друга колба означає новий рівень знань. Логістика, сортування, перші справжні виробничі лінії. Пам'ять повертається: сигнал був повторюваною послідовністю, схожою на координати.»
turrets=«Тривога! Місцева фауна реагує на забруднення від ваших печей. Зграї біттерів уже недалеко. Нам потрібні турелі, а турелям набої. Багато набоїв.»
walls=«Турелі добре стріляють, але погано тримають удар. Мур дасть нам час, а нові військові технології дадуть нам перевагу.»
oil=«Під нами є нафта. Без неї не буде ні пластику, ні вибухівки, ні ракетного палива. Качалки, перегінна установка і багато труб.»
plastic=«Пластик плюс мідь плюс трохи впертості дорівнює складним схемам. Тепер можна будувати машини, а не просто механізми. Я відчуваю, що в мені вмикаються нові модулі.»
military-science=«Біттери вчаться, і ми теж мусимо. Військова наука відкриє важче озброєння. Нам не потрібна війна, нам потрібен спокій, щоб працювати.»
blue-science=«Хімічні колби цінні як рідкісний мінерал. З ними відкриваються роботи, сонячна енергія і модулі. І ще, я нарешті розшифрувала частину сигналу: він іде з-за меж планети.»
rails=«Родовища біля бази виснажуються. Потяги довезуть руду з будь-якої відстані, а ваші ноги трохи відпочинуть.»
solar=«Пару від котлів треба годувати. Сонце світить безкоштовно, а акумулятори допоможуть пережити ніч.»
robots=«Пам'ятаєте, як ми ставили кожну стрічку вручну? Тепер це зроблять роботи. Будівельний рій виконує креслення швидше, ніж ви встигнете випити каву, якої у нас, утім, немає.»
purple-science=«Виробнича наука вимагає справжніх заводів. Тут уже недостатньо кількох асемблерів, тут потрібна промисловість.»
yellow-science=«Утилітарна наука потребує рушіїв, роботів і точних схем. На цьому рівні вже можна будувати те, що полетить у небо.»
modules=«Кожен модуль робить машину трохи розумнішою. Маяки поширюють цей ефект на сусідів. Ефективність стане нашою зброєю проти часу.»
nuclear=«Урановий центрифуговий процес повільний, але він вартий того. Один реактор дає стільки ж енергії, скільки поле котлів. Тільки не забувайте про охолодження.»
silo=«Ось ми й тут. Ракетна шахта стане нашим квитком з цієї планети. Їй потрібні сотні деталей і тисячі компонентів. Почнімо збирати.»
launch=«Усе готово. Запуск означає, що ми нарешті надішлемо сигнал у відповідь. Хтось там має дізнатися, що з “Авророю” сталося, і що ми досі тут.»
space-science=«Супутник на орбіті передає дані. Космічна наука відкриває знання, яких ми ніколи б не здобули на поверхні. Якщо це кінець нашої подорожі, то кінець гідний.»
platform=«Ракети вміють не лише відправляти сигнали, вони можуть нести будівельні матеріали. Збудуймо на орбіті платформу, наш власний острів у небі. Збирачі астероїдів і дробарки забезпечать її сировиною.»
thrusters=«Платформа поки лише висить на місці. Двигуни дадуть їй змогу рухатися. Тепер сигнал читається ясніше: у системі є інші планети, а на них маяки рятувальних капсул “Аврори”.»
vulcanus-landing=«Вулкан. Лава, попіл і кислота. Одна з наших капсул упала сюди і досі передає сигнал. Ливарня працює з розплавленим металом, на цій планеті без неї ніяк.»
vulcanus-science=«Великі бурові вгризаються навіть у вольфрам. Металургійна наука розкриває секрети жари, а маяк капсули передає перший фрагмент координат.»
fulgora-landing=«Фульгора. Тут постійні грози, а в руїнах лежить сміття колишньої цивілізації. Переробники розберуть його на корисні частини, а блискавковідводи зловлять небесну енергію.»
fulgora-science=«Електромагнітний завод робить з голмію чудеса. Ця планета була схожа на нашу базу, поки щось її не зруйнувало. Другий фрагмент координат у нас.»
gleba-landing=«Глеба. Тут усе живе, росте і псується. Агрономічні вежі зберуть врожай, а біокамери перероблять його. Слідкуйте за свіжістю продукції, тут ніщо не лежить вічно.»
gleba-science=«Біофлюс, сяйні плоди, агрономічна наука. Глеба вчить, що виробництво теж може бути живим. Третій фрагмент координат вказує на крижану планету.»
aquilo-landing=«Аквіло. Лід, океан аміаку і мороз, від якого тріскаються труби. Без обігрівальних веж тут не вижити. Звідси сигнал чути найчіткіше.»
aquilo-science=«Кріогенна наука відкриває останні таємниці фізики. Тепер я можу зібрати всі фрагменти в одну картину: сигнал іде з-за краю Сонячної системи.»
fusion=«Термоядерний реактор схожий на маленьке сонце в коробці. З такою енергією нашим платформам вистачить сил долетіти куди завгодно. Навіть туди, звідки ніхто не повертався.»
railgun=«На краю системи літають астероїди, з якими звичайні турелі не впораються. Рейкотрон розірве навіть найбільший. Ми готові.»
edge=«Ось воно, джерело сигналу. Маяк, старший за “Аврору”, старший за будь-які людські кораблі. Він кликав не нас конкретно, а будь-кого, хто дістанеться так далеко. І ви дісталися.»
shattered=«За краєм є Розбита планета: уламки світу, на якому, можливо, колись теж будували фабрики. Прометієва наука це ключ до знань, які маяк охороняв століттями. Останній запис у моєму журналі за вами, інженере.»
