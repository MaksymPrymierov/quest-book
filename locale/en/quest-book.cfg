[quest-book-story]
wake=The alarm has gone quiet. The colony ship Aurora is now debris scattered across alien grass. A voice crackles in your helmet:\n"You're conscious? I'm ECHO, the ship's intelligence. Or what's left of me, living in your suit. We need metal. Let's start small."
drills="You can't dig by hand forever. Burner drills are crude, but they work on their own. Place a few, and the furnaces will get ore while you do something else."
power="My batteries are almost dead, and without power I can't help you. A pump, a boiler and a steam engine. The simplest power plant imaginable, but it will do for a start."
lab="I can hear the generator humming. Good. My databanks are damaged, but a research lab can help restore them. Let's start with automation. We can't do everything by hand."
red-science="Every red flask restores a piece of my memory. Here is what I've remembered: the Aurora didn't drift off course by accident. We were following a signal. I don't know yet where it came from."
belts="Ore can be carried in your pockets. Or it can flow to the furnaces on its own. Belts will become the bloodstream of your base."
green-science="A second flask means a new level of knowledge: logistics, sorting, the first real production lines. More memory is coming back. The signal was a repeating sequence that looked like coordinates."
turrets="Alert! The local fauna is reacting to your furnaces' pollution. Biter packs are already close. We need turrets, and the turrets need ammo. A lot of ammo."
walls="Turrets shoot well but take hits poorly. A wall will buy us time, and new military technology will give us an edge."
oil="There is oil beneath us. Without it there's no plastic, no explosives and no rocket fuel. Pumpjacks, a refinery and a lot of pipes."
plastic="Plastic plus copper plus a little stubbornness equals advanced circuits. Now we can build machines, not just mechanisms. I can feel new modules waking up inside me."
military-science="The biters are learning, so we must too. Military science unlocks heavier weapons. We don't want a war. We want enough peace to work."
blue-science="Chemical flasks are as valuable as a rare mineral. They unlock robots, solar power and modules. And I've finally decoded part of the signal: it comes from beyond this planet."
rails="The deposits near the base are running dry. Trains will bring ore from any distance, and your legs will get some rest."
solar="The boilers have to be fed. The sun shines for free, and accumulators will carry us through the night."
robots="Remember placing every belt by hand? Now robots will do it. A construction swarm builds a blueprint faster than you could drink a coffee. Which, granted, we don't have."
purple-science="Production science demands real factories. A handful of assemblers won't cut it anymore. This takes industry."
yellow-science="Utility science needs engines, robots and precise circuits. At this level we can build things that fly."
modules="Every module makes a machine a little smarter. Beacons share that effect with their neighbours. Efficiency will be our weapon against time."
nuclear="Uranium enrichment is slow, but worth it. One reactor gives as much energy as a field of boilers. Just don't forget about cooling."
silo="Here we are. The rocket silo is our ticket off this planet. It needs hundreds of parts and thousands of components. Let's get building."
launch="Everything is ready. A launch means we finally answer the signal. Someone out there should learn what happened to the Aurora, and that we're still here."
space-science="The satellite in orbit is sending data. Space science unlocks knowledge we could never gain on the surface. If this is where our journey ends, it is a worthy end."
platform="Rockets can carry more than signals. They can carry building materials. Let's build a platform in orbit, our own island in the sky. Asteroid collectors and crushers will keep it supplied."
thrusters="For now the platform just hangs in place. Thrusters will let it move. And the signal is clearer now: there are other planets in this system, and on them, the beacons of the Aurora's escape pods."
vulcanus-landing="Vulcanus. Lava, ash and acid. One of our pods crashed here and is still transmitting. The foundry works with molten metal, and on this planet you can't do without it."
vulcanus-science="Big mining drills bite even into tungsten. Metallurgic science unlocks the secrets of heat, and the pod's beacon hands over the first fragment of the coordinates."
fulgora-landing="Fulgora. Constant storms, and the ruins hold the scrap of a former civilisation. Recyclers will take it apart into useful pieces, and lightning rods will catch the sky's energy."
fulgora-science="The electromagnetic plant works wonders with holmium. This planet once looked like our base, until something destroyed it. The second coordinate fragment is ours."
gleba-landing="Gleba. Everything here lives, grows and spoils. Agricultural towers will gather the harvest, and biochambers will process it. Watch the freshness. Nothing here lasts forever."
gleba-science="Bioflux, glowing fruit, agricultural science. Gleba teaches that production can be alive too. The third coordinate fragment points to an icy planet."
aquilo-landing="Aquilo. Ice, an ammonia ocean and a cold that cracks pipes. Without heating towers you won't survive here. From here, the signal is clearest."
aquilo-science="Cryogenic science unlocks the last mysteries of physics. Now I can put all the fragments together: the signal comes from beyond the edge of the solar system."
fusion="A fusion reactor is a small sun in a box. With that kind of power our platforms can fly anywhere. Even where no one has ever returned from."
railgun="The asteroids at the edge of the system are too much for ordinary turrets. A railgun will split even the largest. We're ready."
edge="There it is, the source of the signal. A beacon older than the Aurora, older than any human ship. It wasn't calling us. It was calling anyone who could make it this far. And you did."
shattered="Beyond the edge lies the Shattered Planet: the remains of a world where someone may also once have built factories. Promethium science is the key to the knowledge the beacon has guarded for centuries. The last entry in my journal is yours, engineer."
